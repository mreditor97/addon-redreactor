---
name: Red Reactor Battery Monitor
description: Red Reactor Battery Monitoring service
version: dev
slug: redreactor
url: https://github.com/mreditor97/app-redreactor
startup: services
arch:
  - aarch64
init: false
devices:
  - /dev/i2c-1
map:
  - ssl:ro
hassio_api: true
hassio_role: manager
services:
  - mqtt:want
options:
  mqtt:
    tls:
      enabled: false
  hostname:
    name: redreactor-pi
    pretty: Raspberry Pi
  homeassistant:
    discovery_interval: 120
    expire_after: 120
  ina: {}
  battery:
    # Samsung INR18650-35E at 0.2A, read off the lygte-info.dk discharge chart
    curve:
      - voltage: 2.80
        level: 0
      - voltage: 3.08
        level: 5
      - voltage: 3.25
        level: 10
      - voltage: 3.39
        level: 15
      - voltage: 3.44
        level: 20
      - voltage: 3.55
        level: 30
      - voltage: 3.63
        level: 40
      - voltage: 3.71
        level: 50
      - voltage: 3.80
        level: 60
      - voltage: 3.89
        level: 70
      - voltage: 3.99
        level: 80
      - voltage: 4.06
        level: 90
      - voltage: 4.08
        level: 95
      - voltage: 4.16
        level: 100
  system:
    shutdown: ha host shutdown
    restart: ha host restart
  logging:
    console: INFO
    file: WARNING
schema:
  mqtt:
    broker: str?
    port: port?
    user: str?
    password: password?
    client_id: str?
    tls:
      enabled: bool
      ca_certs: str?
      certfile: str?
      keyfile: str?
      insecure: bool?
  hostname:
    name: match(^[^/+#]+$)
    pretty: str
  homeassistant:
    discovery: bool?
    discovery_interval: int(1,)
    expire_after: int(0,)
  ina:
    address: int(3,119)?
    monitor_interval: int(1,60)?
  battery:
    internal_resistance: float(0,)?
    average_readings: int(1,100)?
    curve:
      - voltage: float
        level: float(0,100)
  system:
    shutdown: str
    restart: str
  logging:
    console: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
    file: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
