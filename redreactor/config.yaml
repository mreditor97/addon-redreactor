---
name: Red Reactor Battery Monitor
description: Red Reactor Battery Monitoring service
version: dev
slug: redreactor
url: https://github.com/mreditor97/app-redreactor
startup: services
arch:
  - aarch64
init: false
devices:
  - /dev/i2c-1
map:
  - ssl:ro
hassio_api: true
hassio_role: manager
services:
  - mqtt:want
options:
  mqtt:
    tls:
      enabled: false
  hostname:
    name: redreactor-pi
    pretty: Raspberry Pi
  homeassistant:
    discovery_interval: 120
    expire_after: 120
  ina: {}
  battery:
    curve: []
  system:
    shutdown: ha host shutdown
    restart: ha host restart
  logging:
    console: INFO
    file: WARNING
schema:
  mqtt:
    broker: match(^\S+$)?
    port: port?
    user: str?
    password: password?
    client_id: str?
    tls:
      enabled: bool
      ca_certs: str?
      certfile: str?
      keyfile: str?
      insecure: bool?
  hostname:
    name: match(^[^/+#]+$)
    pretty: match(^.*\S.*$)
  homeassistant:
    discovery: bool?
    discovery_interval: int(1,86400)
    expire_after: int(0,)
    status_topic: match(^[^+#]+$)?
    status_online: match(^.+$)?
  ina:
    address: int(3,119)?
    monitor_interval: int(1,60)?
  battery:
    internal_resistance: float(0,)?
    average_readings: int(1,100)?
    curve:
      - voltage: float
        level: float(0,100)
  system:
    shutdown: match(^.*\S.*$)
    restart: match(^.*\S.*$)
  logging:
    console: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
    file: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
