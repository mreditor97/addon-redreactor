---
name: Redreactor

# yamllint disable-line rule:truthy
on:
  # Sent by the redreactor release workflow with a new alpha (edge, after CI
  # passes on master) or beta (after a pre-release is published), whose wheel
  # is attached to a redreactor GitHub pre-release
  repository_dispatch:
    types:
      - redreactor-release

concurrency:
  group: redreactor

permissions: {}

jobs:
  update:
    name: Update the ${{ github.event.client_payload.channel }} app
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: ℹ️ Check the requested release
        id: release
        env:
          CHANNEL: ${{ github.event.client_payload.channel }}
          TAG: ${{ github.event.client_payload.tag }}
          WHEEL: ${{ github.event.client_payload.wheel }}
        run: |
          if [[ "${CHANNEL}" != "edge" && "${CHANNEL}" != "beta" ]]; then
            echo "::error ::Not an app channel: ${CHANNEL}"
            exit 1
          fi
          if [[ ! "${TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*$ ]]; then
            echo "::error ::Not a redreactor release tag: ${TAG}"
            exit 1
          fi
          if [[ ! "${WHEEL}" =~ ^redreactor-[0-9A-Za-z.]+-py3-none-any\.whl$ ]]; then
            echo "::error ::Not a redreactor wheel: ${WHEEL}"
            exit 1
          fi
          {
            echo "channel=${CHANNEL}"
            echo "tag=${TAG}"
            echo "wheel=${WHEEL}"
          } >> "$GITHUB_OUTPUT"
      - name: ⤵️ Check out code from GitHub
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          # Full history and tags, to work out the next app beta version
          fetch-depth: 0
          persist-credentials: false
      - name: 🏗 Pin the app to the redreactor release
        id: pin
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          TAG: ${{ steps.release.outputs.tag }}
          WHEEL: ${{ steps.release.outputs.wheel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="https://github.com/${GITHUB_REPOSITORY_OWNER}/redreactor/releases"
          file="redreactor/requirements-${CHANNEL}.txt"
          echo "redreactor @ ${releases}/download/${TAG}/${WHEEL}" > "${file}"
          changed=false
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --file - "${file}" <<MESSAGE
          Update the ${CHANNEL} app to redreactor ${TAG}

          ${releases}/tag/${TAG}
          MESSAGE
            # The token is only used for this push, not kept in the checkout
            git push \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:master
            changed=true
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Edge: the newest commit on master is the edge version, so build it
      - name: 🚀 Build and publish the edge app
        if: |
          steps.release.outputs.channel == 'edge'
          && steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yaml --repo "${GITHUB_REPOSITORY}" --ref master

      # Beta: an app pre-release is the beta version, so create one
      - name: ℹ️ Work out the next app beta version
        id: version
        if: steps.release.outputs.channel == 'beta'
        run: |
          # The next patch after the latest stable app release, then the next
          # free beta number, e.g. 0.1.6 -> 0.1.7-beta.0, 0.1.7-beta.1, ...
          latest=$(git tag --list \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n 1)
          latest="${latest:-0.0.0}"
          IFS=. read -r major minor patch <<< "${latest}"
          base="${major}.${minor}.$((patch + 1))"
          number=0
          while git rev-parse -q --verify "refs/tags/${base}-beta.${number}" \
            > /dev/null; do
            number=$((number + 1))
          done
          echo "version=${base}-beta.${number}" >> "$GITHUB_OUTPUT"
      - name: 🚀 Publish the beta app pre-release
        if: steps.release.outputs.channel == 'beta'
        # Created with RELEASE_TOKEN rather than GITHUB_TOKEN, so that it
        # starts the Deploy workflow, which publishes the app to
        # homeassistant-apps-beta
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          COMMIT: ${{ steps.pin.outputs.commit }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${COMMIT}" \
            --prerelease \
            --title "${VERSION}" \
            --notes "Beta of the app with redreactor ${TAG}."
